<style>
  :root {

    --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg0); }
  body { display: grid; place-items: center; }
  .frame { width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; }
  svg { display: block; width: 100%; height: 100%; }

  .sky { fill: url(#sky); }
  .grid line { stroke: var(--grid); stroke-width: 1; opacity: .55; }
  .shadow { fill: #000; opacity: .32; filter: url(#soft); }
  .rail { stroke: var(--edge); stroke-width: 2; stroke-dasharray: 4 6; opacity: .75; }
  .flow { stroke: var(--accent); stroke-width: 3; stroke-linecap: round;
           stroke-dasharray: 18 18; opacity: 0; }

  .face { stroke: var(--edge); stroke-width: 1.2; stroke-linejoin: round; }
  .face.top { fill: var(--top); }
  .face.top.end { fill: var(--accent-soft); }
  .face.left { fill: var(--left); }
  .face.right { fill: var(--right); }
  .lit { fill: var(--accent); opacity: 0; filter: url(#glow); }

  .slabname { font: 600 15px/1 var(--mono); fill: var(--dim); text-anchor: middle;
               letter-spacing: .04em; }

  .tk-top { fill: #fff; }
  .tk-left { fill: var(--accent); }
  .tk-right { fill: var(--accent-soft); }
  .token { filter: url(#glow); }

  .caption { opacity: 0; }
  .cap-step { font: 700 26px/1 var(--mono); fill: var(--accent); }
  .cap-name { font: 700 26px/1 var(--mono); fill: var(--ink); letter-spacing: .02em; }
  .cap-note { font: 400 19px/1 var(--mono); fill: var(--dim); }

  .card rect { fill: rgba(255,255,255,.035); stroke: var(--edge); stroke-width: 1.2; }
  .card-label { font: 700 13px/1 var(--mono); fill: var(--accent); letter-spacing: .18em; }
  .card-line { font: 400 17px/1 var(--mono); fill: var(--ink); }
  .tie { stroke: var(--edge); stroke-width: 1.5; stroke-dasharray: 3 5; }

  .title { font: 700 34px/1 var(--mono); fill: var(--ink); letter-spacing: -.01em; }
  .subtitle { font: 400 19px/1 var(--mono); fill: var(--dim); }
  .repo { font: 600 15px/1 var(--mono); fill: var(--accent); text-anchor: end;
           letter-spacing: .1em; }
  .footer { font: 400 14px/1 var(--mono); fill: var(--dim); }
  .bar-bg { fill: var(--edge); opacity: .4; }
  .bar { fill: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    /* The still frame is the end of the run: every slab lit and the output showing. */
    * { animation: none !important; }
    .lit, .out, .caption { opacity: 1 !important; }
  }
</style>
