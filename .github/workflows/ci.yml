name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ruff
      - run: ruff check src tests demo.py demo_mcp.py
      - run: ruff format --check src tests demo_mcp.py
      - run: pip install -e .
      - run: pytest -q
      # the README's outputs come from these; a demo that stops running is a stale README
      - run: python demo.py
      - run: python demo_mcp.py
      # the installed entry points, as an MCP client would start them
      - run: paklaw-mcp --check
      - run: paklaw-corpus --help
