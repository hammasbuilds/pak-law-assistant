[project]
name = "pak-law-assistant"
version = "0.1.0"
description = "Bilingual legal question answering over Pakistani statutes, with temporal validity: it will not cite a repealed provision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["legal", "rag", "pakistan", "bm25", "statute", "urdu"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paklaw"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# so `pytest` works in a fresh clone, with nothing installed
pythonpath = ["src"]
testpaths = ["tests"]
