[project]
name = "pak-law-assistant"
version = "0.2.0"
description = "Legal question answering and citation checking over Pakistani statutes, with temporal validity: it will not cite a repealed provision. Includes an MCP server."
authors = [{ name = "Muhammad Hammas" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Indexing",
    "Natural Language :: English",
    "Natural Language :: Urdu",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["legal", "rag", "pakistan", "bm25", "statute", "urdu", "mcp", "mcp-server"]
dependencies = []

[project.urls]
Homepage = "https://github.com/hammasbuilds/pak-law-assistant"
Issues = "https://github.com/hammasbuilds/pak-law-assistant/issues"
Source = "https://github.com/hammasbuilds/pak-law-assistant"

[project.scripts]
paklaw-mcp = "paklaw.mcp_server:main"
# Same server under the package name, so `uvx pak-law-assistant` (what MCP registry
# clients run for a PyPI package) starts it without --from.
pak-law-assistant = "paklaw.mcp_server:main"
paklaw-corpus = "paklaw.ingest:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paklaw"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# so `pytest` works in a fresh clone, with nothing installed
pythonpath = ["src"]
testpaths = ["tests"]
